spring:
  application:
    name: kohliiq-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/kohliiq}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kohliiq-dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

kohliiq:
  cors:
    allowed-origins: http://localhost:5173
